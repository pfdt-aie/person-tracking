name: test

on:
  push:
    branches: [master, akash]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't pull LFS objects — tests don't need the model files.
          lfs: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libs for opencv-python
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Force CPU torch wheel — runners have no GPU and the default
          # ultralytics dependency may pull the much larger CUDA wheel.
          pip install --upgrade --extra-index-url https://download.pytorch.org/whl/cpu torch

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q
